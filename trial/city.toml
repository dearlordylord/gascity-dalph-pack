# Template: render with scripts/render-city.ts before gc init.
[workspace]
name = "@@CITY_NAME@@"
provider = "codex"
isolation = "none"

[providers.codex]
base = "builtin:codex"

[session]
provider = "tmux"

[beads]
provider = "bd"
conditional_writes = "require"
guarded_release = "require"

[daemon]
patrol_interval = "2s"
max_restarts = 2
restart_window = "30m"
shutdown_timeout = "15s"

[[rigs]]
name = "@@RIG@@"
max_active_sessions = 5
default_branch = "@@BRANCH@@"
path = "@@TARGET_REPO@@"

[rigs.imports.dalph]
source = "@@PACK_ROOT@@"

[[patches.agent]]
name = "native-worker"
rig = "@@RIG@@"
work_dir = "@@WORKTREE_ROOT@@"

[[patches.agent]]
name = "native-reviewer"
rig = "@@RIG@@"
work_dir = "@@WORKTREE_ROOT@@"

[orders]
skip = ["dolt-remotes-patrol", "jsonl-export", "mol-dog-backup", "mol-dog-compactor", "mol-dog-stale-db", "prune-branches", "reaper", "wisp-compact"]

# Diagnostics only: tracker/Git facts remain the recovery authorities.
[events.rotation]
enabled = true
max_size_bytes = 268435456
archive_retain_age = "720h"

[workspace.env]
# scripts/render-city.ts supplies exact runtime paths and contracts below.
