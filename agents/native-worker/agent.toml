scope = "rig"
# The selected native provider, options, permissions and runtime inherit Gas City configuration.
prompt_template = "native-worker.md"
min_active_sessions = 0
max_active_sessions = 2
work_query = 'gc ready --metadata-field "gc.routed_to=$GC_TEMPLATE" --unassigned --exclude-type=epic --sort oldest --limit 20 --json'
