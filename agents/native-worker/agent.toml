scope = "rig"
# The selected native provider, options, permissions and runtime inherit Gas City configuration.
prompt_template = "agents/native-worker/native-worker.md"
sleep_after_idle = "10s"
min_active_sessions = 0
max_active_sessions = 2
work_query = ': "${DALPH_PACK_ROOT:?native work query requires DALPH_PACK_ROOT}"; mise exec node@24.20.0 -- node "$DALPH_PACK_ROOT/dist/native-work-query.js"'
