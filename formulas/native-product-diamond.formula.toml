formula = "native-product-diamond"
description = "Four product completion barriers; Gas City owns fork/join readiness"

[requires]
formula_compiler = ">=2.0.0"

[vars.a_instruction]
required = true

[vars.b_instruction]
required = true

[vars.c_instruction]
required = true

[vars.d_instruction]
required = true

[[steps]]
id = "a-launch"
title = "Launch product task A"
description = "{{a_instruction}}"
metadata = { "gc.run_target" = "dalph.native-prepare", "dalph.runtime" = "native-v1", "dalph.phase" = "product-launch", "dalph.product_task" = "a" }

[[steps]]
id = "a"
title = "Product task A"
description = "{{a_instruction}}"
needs = ["a-launch"]
metadata = { "dalph.runtime" = "native-v1", "dalph.phase" = "product-completion", "dalph.product_task" = "a" }

[[steps]]
id = "b-launch"
title = "Launch product task B"
