id = "A-work"
title = "Define data contract: implementation result"
description = "Implement src/model.ts with strict validation of date YYYY-MM-DD, description, currency uppercase three letters, and integer minor-unit amounts parsed from decimal strings without floating-point rounding. Export parseAmount and validateExpense. Add model tests."
