formula = "native-product-continuation"
description = "Explicit finite human-authorized review batch for a retained product attempt"
[requires]
formula_compiler = ">=2.0.0"
[vars.workspace]
required = true
[vars.agent]
required = true
[vars.reviewer]
required = true
[vars.review_check]
required = true
[vars.batch]
required = true
[vars.product_root]
required = true
[vars.previous_batch]
required = true
[[steps]]
id = "prepare"
title = "Bind the retained implementation attempt for human continuation"
metadata = { "dalph.product_workflow" = "{{product_workflow}}", "dalph.product_completion" = "{{product_completion}}", "dalph.product_launch" = "{{product_launch}}", "gc.run_target" = "dalph.native-prepare", "dalph.task" = "task", "dalph.phase" = "prepare", "dalph.runtime" = "native-v1", "dalph.product_root" = "{{product_root}}", "dalph.review_batch" = "{{batch}}" }
[[steps]]
id = "review"
needs = ["prepare"]
expand = "native-independent-review"
expand_vars = { product_workflow = "{{product_workflow}}", product_completion = "{{product_completion}}", product_launch = "{{product_launch}}", agent = "{{agent}}", reviewer = "{{reviewer}}", review_check = "{{review_check}}", batch = "{{batch}}", product_root = "{{product_root}}", previous_batch = "{{previous_batch}}", delivery_scope = "delivery-scope", workspace = "{{workspace}}" }
[[steps]]
id = "qualify"
title = "Qualify the exact candidate approved by the continued review batch"
needs = ["review"]
metadata = { "dalph.product_workflow" = "{{product_workflow}}", "dalph.product_completion" = "{{product_completion}}", "dalph.product_launch" = "{{product_launch}}", "gc.scope_ref" = "delivery-scope", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "dalph.native-qualifier", "dalph.task" = "task", "dalph.phase" = "qualify", "dalph.runtime" = "native-v1", "dalph.product_root" = "{{product_root}}", "dalph.review_batch" = "{{batch}}" }
[[steps]]
id = "deliver"
title = "Publish, promote and settle the retained implementation attempt"
needs = ["qualify"]
metadata = { "dalph.product_workflow" = "{{product_workflow}}", "dalph.product_completion" = "{{product_completion}}", "dalph.product_launch" = "{{product_launch}}", "gc.scope_ref" = "delivery-scope", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "dalph.native-integrator", "dalph.task" = "task", "dalph.phase" = "deliver", "dalph.runtime" = "native-v1", "dalph.product_root" = "{{product_root}}", "dalph.review_batch" = "{{batch}}" }

[[steps]]
id = "delivery-scope"
title = "Stop downstream delivery when the continued review batch fails"
needs = ["deliver"]
metadata = { "dalph.product_workflow" = "{{product_workflow}}", "dalph.product_completion" = "{{product_completion}}", "dalph.product_launch" = "{{product_launch}}", "gc.kind" = "scope", "gc.scope_name" = "delivery", "gc.scope_role" = "body" }

[vars.product_workflow]
required = true

[vars.product_completion]
required = true

[vars.product_launch]
required = true

[[steps]]
id = "product-settlement"
title = "Settle the original product barrier after human continuation"
needs = ["delivery-scope"]
metadata = { "gc.scope_ref" = "delivery-scope", "gc.scope_role" = "teardown", "gc.run_target" = "dalph.native-prepare", "dalph.phase" = "product-settlement", "dalph.runtime" = "native-v1", "dalph.task" = "task", "dalph.product_root" = "{{product_root}}", "dalph.review_batch" = "{{batch}}", "dalph.product_workflow" = "{{product_workflow}}", "dalph.product_completion" = "{{product_completion}}", "dalph.product_launch" = "{{product_launch}}" }
